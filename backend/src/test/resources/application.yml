spring:
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

server:
  port: 0

jwt:
  secret: test-only-jwt-secret-never-use-in-production-environments-0123456789abcdef
  expiration: 3600000

fsmonitor:
  data-dir: ${java.io.tmpdir}/fs-monitor-test-data
  admin-password: AdminPass1

logging:
  level:
    com.fsmonitor.app: warn
