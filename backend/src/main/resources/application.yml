application:
  version: @project.version@

spring:
  application:
    name: fs-monitor-backend

  datasource:
    url: jdbc:h2:file:${FS_MONITOR_DATA_DIR:./data}/fsmonitor;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
    driver-class-name: org.h2.Driver
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:password}

  h2:
    console:
      # Dev convenience - disabled in the production profile
      enabled: ${H2_CONSOLE_ENABLED:false}
      path: /h2-console
      settings:
        web-allow-others: false

  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: false

  sql:
    init:
      mode: never

  lifecycle:
    timeout-per-shutdown-phase: 20s

  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:25}

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

# FS-Monitor specific settings
fsmonitor:
  # Directory for generated secrets and the H2 database file
  data-dir: ${FS_MONITOR_DATA_DIR:./data}
  # Optional initial password for the auto-created admin account
  admin-password: ${FS_MONITOR_ADMIN_PASSWORD:}
  # Key used for AES-256-GCM encryption of stored credentials.
  # Generated and persisted in <data-dir>/encryption.key when not set.
  encryption-key: ${FS_MONITOR_ENCRYPTION_KEY:}
  # Timeout for external shell commands executed by the monitors
  command-timeout-seconds: ${FS_MONITOR_COMMAND_TIMEOUT:120}
  sftp:
    # OpenSSH known_hosts file for strict SFTP host key verification
    known-hosts: ${FSMONITOR_SFTP_KNOWNHOSTS:${user.home}/.ssh/known_hosts}
  security:
    # Honor X-Forwarded-For for rate limiting; enable only behind a reverse
    # proxy that overwrites/sanitizes the header
    trust-forwarded-headers: ${FS_MONITOR_TRUST_FORWARDED_HEADERS:false}
    login:
      # After this many consecutive failures a username+IP pair is locked
      max-attempts: ${FS_MONITOR_LOGIN_MAX_ATTEMPTS:5}
      # Lockout duration in minutes once the limit is reached
      lockout-minutes: ${FS_MONITOR_LOGIN_LOCKOUT_MINUTES:15}

jwt:
  # Secret for signing JWT tokens. Generated and persisted in
  # <data-dir>/jwt.secret when not set. Set JWT_SECRET explicitly in production.
  secret: ${JWT_SECRET:}
  expiration: ${JWT_EXPIRATION_MS:86400000} # 24 hours

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:8088,http://localhost:3000,http://localhost:5173}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    # Outbound SMTP is optional - a missing mail relay must not fail readiness
    mail:
      enabled: false

logging:
  level:
    com.fsmonitor.app: INFO
    org.springframework.security: WARN
    org.hibernate: WARN
    org.hibernate.SQL: WARN
    org.hibernate.type.descriptor.sql.BasicBinder: WARN
    org.springframework.web: WARN
    org.springframework.web.context.request.async: ERROR
    org.apache.catalina.connector: ERROR
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %msg%n"
